<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#f0f4f8" stroke="#333" stroke-width="3"/>
  
  <!-- Dark wings background -->
  <path d="M 80 180 Q 60 200 70 280 Q 80 340 120 380 L 120 280 Z" fill="#1a1a1a"/>
  <path d="M 432 180 Q 452 200 442 280 Q 432 340 392 380 L 392 280 Z" fill="#1a1a1a"/>
  
  <!-- Main shield -->
  <path d="M 150 120 L 362 120 L 362 280 Q 256 340 150 280 Z" fill="#0B3A7D" stroke="#fff" stroke-width="3"/>
  
  <!-- Shield top highlight -->
  <ellipse cx="256" cy="130" rx="100" ry="30" fill="#fff" opacity="0.3"/>
  
  <!-- Banner/chevron at top of shield -->
  <path d="M 200 150 L 256 120 L 312 150 Z" fill="#fff" stroke="#0B3A7D" stroke-width="1"/>
  <rect x="200" y="150" width="112" height="25" fill="#fff" stroke="#0B3A7D" stroke-width="1"/>
  
  <!-- Center circle emblem -->
  <circle cx="256" cy="210" r="45" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="256" cy="210" r="35" fill="none" stroke="#fff" stroke-width="2"/>
  
  <!-- Cross in center -->
  <line x1="256" y1="175" x2="256" y2="245" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="225" y1="210" x2="287" y2="210" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Shield base detail -->
  <path d="M 180 260 L 256 300 L 332 260" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="220,270 256,295 292,270" fill="none" stroke="#fff" stroke-width="2"/>
  
  <!-- Left red emblem (scales/sword shape) -->
  <path d="M 130 280 Q 100 300 110 360 Q 120 380 140 380 Q 130 340 140 300 Z" fill="#C1121F" stroke="#fff" stroke-width="2"/>
  <path d="M 115 290 Q 90 310 100 360 Q 108 375 125 380 Q 115 345 125 310 Z" fill="#E63946" stroke="#fff" stroke-width="1"/>
  
  <!-- Right red emblem (scales/sword shape) -->
  <path d="M 382 280 Q 412 300 402 360 Q 392 380 372 380 Q 382 340 372 300 Z" fill="#C1121F" stroke="#fff" stroke-width="2"/>
  <path d="M 397 290 Q 422 310 412 360 Q 404 375 387 380 Q 397 345 387 310 Z" fill="#E63946" stroke="#fff" stroke-width="1"/>
  
  <!-- White banner/scroll at bottom -->
  <ellipse cx="256" cy="380" rx="110" ry="30" fill="#fff" stroke="#0B3A7D" stroke-width="2"/>
  
  <!-- Outer circle border -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="256" cy="256" r="245" fill="none" stroke="#fff" stroke-width="2"/>
</svg>
